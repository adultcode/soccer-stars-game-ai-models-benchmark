<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cap Soccer Stars</title>
<style>
  :root {
    --bg: #0d1b2a;
    --panel: #14263b;
    --red: #e63946;
    --blue: #2f80ed;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at top, #1b3a5c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 12px;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app { width: 100%; max-width: 820px; }
  #topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: var(--panel); padding: 10px 14px;
    border-radius: 14px 14px 0 0; border: 1px solid rgba(255,255,255,.08); border-bottom: none;
  }
  .score { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .team { display: flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.3); }
  .dot.red { background: var(--red); }
  .dot.blue { background: var(--blue); }
  .num { font-variant-numeric: tabular-nums; font-size: 22px; min-width: 18px; text-align: center; }
  .sep { color: var(--muted); }
  #status {
    padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap;
    background: rgba(255,255,255,.07); transition: background .2s, color .2s;
  }
  #status.player { background: rgba(230,57,70,.2); color: #ffb3b9; }
  #status.ai { background: rgba(47,128,237,.22); color: #b3d1ff; }
  #status.goal { background: rgba(251,191,36,.25); color: var(--accent); }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px; padding: 8px 16px;
    font-weight: 800; color: #1a1a1a; background: var(--accent);
    box-shadow: 0 3px 0 #b7860b; transition: transform .08s, box-shadow .08s;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b7860b; }
  #stage {
    position: relative; line-height: 0; overflow: hidden;
    border-radius: 0 0 14px 14px; border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  #hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.4; }
  #modal {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(5,12,22,.6); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    line-height: normal;
  }
  #modal.show { display: flex; }
  .card {
    background: var(--panel); padding: 28px 40px; border-radius: 18px; text-align: center;
    border: 1px solid rgba(255,255,255,.12); animation: pop .35s ease-out;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .card h2 { font-size: 42px; letter-spacing: 2px; margin-bottom: 6px; }
  .card p { color: var(--muted); margin-bottom: 18px; font-size: 16px; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (max-width: 520px) {
    .score { font-size: 14px; gap: 6px; }
    .num { font-size: 18px; }
    #status { font-size: 12px; padding: 5px 10px; }
    button { padding: 7px 12px; font-size: 14px; }
    .card { padding: 18px 22px; }
    .card h2 { font-size: 30px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="score">
      <span class="team"><span class="dot red"></span>Player: <span id="pScore" class="num">0</span></span>
      <span class="sep">|</span>
      <span class="team"><span class="dot blue"></span>AI: <span id="aScore" class="num">0</span></span>
    </div>
    <div id="status" class="player">Your Turn</div>
    <button id="resetBtn" type="button">Reset Game</button>
  </div>
  <div id="stage">
    <canvas id="game" width="800" height="500"></canvas>
    <div id="modal">
      <div class="card">
        <h2 id="modalTitle">VICTORY!</h2>
        <p id="modalText"></p>
        <button id="modalBtn" type="button">Reset Game</button>
      </div>
    </div>
  </div>
  <div id="hint">Press on a red cap, drag back like a slingshot, and release to shoot. First to 2 goals wins.</div>
</div>

<script>
(() => {
  'use strict';

  // =====================================================================
  // CONFIG
  // =====================================================================
  const W = 800, H = 500;
  const PITCH = { l: 50, r: 750, t: 25, b: 475 };
  const GOAL = { top: 190, bottom: 310, depth: 40 };

  const CAP_R = 22, CAP_M = 3.0;
  const BALL_R = 12, BALL_M = 1.0;
  const CAP_FRICTION = 0.985, BALL_FRICTION = 0.990;
  const STOP_SPEED = 0.05;          // px/frame — below this, velocity snaps to zero
  const BOUNCE = 0.85;              // wall restitution

  const MAX_DRAG = 120;             // px
  const MAX_SPEED = 22;             // px/frame launch speed at full drag
  const POWER_FACTOR = MAX_SPEED / MAX_DRAG;
  const MIN_DRAG = 10;              // shorter drags are cancelled

  const SUBSTEPS = 4;               // physics substeps per frame (prevents tunnelling)
  const WIN_SCORE = 2;
  const GOAL_PAUSE_MS = 1500;
  const AI_DELAY_MS = 1000;
  const STEP_MS = 1000 / 60;        // fixed 60 Hz simulation step
  const TAU = Math.PI * 2;

  const KICKOFF = {
    player: [{ x: 140, y: 250 }, { x: 290, y: 165 }, { x: 290, y: 335 }],
    ai:     [{ x: 660, y: 250 }, { x: 510, y: 165 }, { x: 510, y: 335 }],
    ball:   { x: 400, y: 250 }
  };

  // Static wall segments: pitch sides plus the recessed goal boxes.
  // Segment endpoints double as the goal posts (round collision corners).
  const WALLS = (() => {
    const { l, r, t, b } = PITCH, gt = GOAL.top, gb = GOAL.bottom, d = GOAL.depth;
    const s = (x1, y1, x2, y2) => ({ x1, y1, x2, y2 });
    return [
      s(l, t, r, t), s(l, b, r, b),                         // top / bottom touchlines
      s(l, t, l, gt), s(l, gb, l, b),                       // left goal line (outside mouth)
      s(l - d, gt, l, gt), s(l - d, gb, l, gb), s(l - d, gt, l - d, gb), // left net: top, bottom, back
      s(r, t, r, gt), s(r, gb, r, b),                       // right goal line
      s(r, gt, r + d, gt), s(r, gb, r + d, gb), s(r + d, gt, r + d, gb)  // right net
    ];
  })();

  // =====================================================================
  // DOM
  // =====================================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const elP = document.getElementById('pScore');
  const elA = document.getElementById('aScore');
  const elStatus = document.getElementById('status');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalText = document.getElementById('modalText');

  // =====================================================================
  // STATE
  // =====================================================================
  let caps = [], ball = null, bodies = [];
  let score = { player: 0, ai: 0 };
  let turn = 'player';              // 'player' | 'ai'
  let isMoving = false;             // true while ANY body has non-zero velocity
  let shotFired = false;            // a shot was taken this turn and hasn't settled yet
  let goalPause = false;
  let gameOver = false;
  let goalInfo = null;              // { scorer, start }
  let aiPending = false;
  let drag = null;                  // { cap, x, y }
  let timers = [];
  let dpr = 1;
  let pitchLayer = null, netLayer = null;
  let hudCache = '';

  // =====================================================================
  // HELPERS
  // =====================================================================
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function later(fn, ms) {
    const id = setTimeout(() => { timers = timers.filter(t => t !== id); fn(); }, ms);
    timers.push(id);
    return id;
  }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function makeBody(x, y, r, m, friction, team) {
    return { x, y, vx: 0, vy: 0, r, m, friction, team, rot: 0 };
  }

  // Shortest distance from point P to segment AB
  function segDist(px, py, x1, y1, x2, y2) {
    const ex = x2 - x1, ey = y2 - y1;
    const len2 = ex * ex + ey * ey;
    let t = len2 ? ((px - x1) * ex + (py - y1) * ey) / len2 : 0;
    t = clamp(t, 0, 1);
    return Math.hypot(px - (x1 + ex * t), py - (y1 + ey * t));
  }

  // =====================================================================
  // SETUP / RESET
  // =====================================================================
  function resetPositions() {
    caps = [
      ...KICKOFF.player.map(p => makeBody(p.x, p.y, CAP_R, CAP_M, CAP_FRICTION, 'player')),
      ...KICKOFF.ai.map(p => makeBody(p.x, p.y, CAP_R, CAP_M, CAP_FRICTION, 'ai'))
    ];
    ball = makeBody(KICKOFF.ball.x, KICKOFF.ball.y, BALL_R, BALL_M, BALL_FRICTION, 'ball');
    bodies = [...caps, ball];
    isMoving = false;
    shotFired = false;
    drag = null;
  }

  function resetGame() {
    clearTimers();
    score = { player: 0, ai: 0 };
    turn = 'player';
    gameOver = false;
    goalPause = false;
    goalInfo = null;
    aiPending = false;
    modal.classList.remove('show');
    resetPositions();
    updateHUD(true);
  }

  // =====================================================================
  // PHYSICS
  // =====================================================================
  function updatePhysics() {
    // Integrate in substeps so fast bodies can't skip through walls or each other.
    for (let s = 0; s < SUBSTEPS; s++) {
      for (const b of bodies) {
        b.x += b.vx / SUBSTEPS;
        b.y += b.vy / SUBSTEPS;
      }
      resolveCollisions();
    }

    // Exponential friction, once per frame.
    let moving = false;
    for (const b of bodies) {
      b.vx *= b.friction;
      b.vy *= b.friction;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp < STOP_SPEED) { b.vx = 0; b.vy = 0; }
      else {
        moving = true;
        if (b === ball) b.rot += (b.vx >= 0 ? 1 : -1) * sp / (BALL_R * 1.6);
      }
    }
    isMoving = moving;
  }

  function resolveCollisions() {
    for (let i = 0; i < bodies.length; i++) {
      for (let j = i + 1; j < bodies.length; j++) collideCircles(bodies[i], bodies[j]);
    }
    for (const b of bodies) {
      for (const w of WALLS) collideWall(b, w);
      keepInBounds(b);
    }
  }

  // Elastic circle–circle collision with positional overlap correction.
  function collideCircles(a, b) {
    let dx = b.x - a.x, dy = b.y - a.y;
    let d2 = dx * dx + dy * dy;
    const minD = a.r + b.r;
    if (d2 >= minD * minD) return;
    if (d2 < 1e-9) { dx = 0.01; dy = 0; d2 = 1e-4; }   // perfectly stacked: nudge apart

    const d = Math.sqrt(d2);
    const nx = dx / d, ny = dy / d;

    // 1) Separate along the normal, weighted by inverse mass.
    const overlap = minD - d;
    const invA = 1 / a.m, invB = 1 / b.m, invSum = invA + invB;
    a.x -= nx * overlap * (invA / invSum);
    a.y -= ny * overlap * (invA / invSum);
    b.x += nx * overlap * (invB / invSum);
    b.y += ny * overlap * (invB / invSum);

    // 2) Momentum transfer:
    //    v1' = v1 - 2m2/(m1+m2) * <v1-v2, x1-x2>/|x1-x2|^2 * (x1-x2)
    const rx = a.x - b.x, ry = a.y - b.y;
    const r2 = rx * rx + ry * ry;
    const dot = (a.vx - b.vx) * rx + (a.vy - b.vy) * ry;
    if (dot >= 0) return;                               // already separating
    const ka = (2 * b.m / (a.m + b.m)) * dot / r2;
    const kb = (2 * a.m / (a.m + b.m)) * dot / r2;
    a.vx -= ka * rx;  a.vy -= ka * ry;
    b.vx += kb * rx;  b.vy += kb * ry;                  // (x2 - x1) = -(x1 - x2)
  }

  // Circle vs line segment (walls, net, posts).
  function collideWall(b, w) {
    const ex = w.x2 - w.x1, ey = w.y2 - w.y1;
    const len2 = ex * ex + ey * ey;
    const t = clamp(((b.x - w.x1) * ex + (b.y - w.y1) * ey) / len2, 0, 1);
    const cx = w.x1 + ex * t, cy = w.y1 + ey * t;
    const dx = b.x - cx, dy = b.y - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 >= b.r * b.r) return;

    let d = Math.sqrt(d2), nx, ny;
    if (d < 1e-6) {
      const l = Math.sqrt(len2);
      nx = -ey / l; ny = ex / l;
      if ((W / 2 - cx) * nx + (H / 2 - cy) * ny < 0) { nx = -nx; ny = -ny; }
      d = 0;
    } else {
      nx = dx / d; ny = dy / d;
    }
    const pen = b.r - d;
    b.x += nx * pen;
    b.y += ny * pen;
    const vn = b.vx * nx + b.vy * ny;
    if (vn < 0) {
      b.vx -= (1 + BOUNCE) * vn * nx;
      b.vy -= (1 + BOUNCE) * vn * ny;
    }
  }

  // Safety net: nothing may ever leave the playable area.
  function keepInBounds(b) {
    const minX = PITCH.l - GOAL.depth + b.r, maxX = PITCH.r + GOAL.depth - b.r;
    if (b.x < minX) { b.x = minX; if (b.vx < 0) b.vx = -b.vx * BOUNCE; }
    if (b.x > maxX) { b.x = maxX; if (b.vx > 0) b.vx = -b.vx * BOUNCE; }
    if (b.y < PITCH.t + b.r) { b.y = PITCH.t + b.r; if (b.vy < 0) b.vy = -b.vy * BOUNCE; }
    if (b.y > PITCH.b - b.r) { b.y = PITCH.b - b.r; if (b.vy > 0) b.vy = -b.vy * BOUNCE; }
    // Center behind a goal line but outside the goal box => escaped past a post.
    if ((b.x < PITCH.l || b.x > PITCH.r) && (b.y < GOAL.top || b.y > GOAL.bottom)) {
      b.x = b.x < PITCH.l ? PITCH.l + b.r : PITCH.r - b.r;
      b.vx = -b.vx * BOUNCE;
    }
  }

  // =====================================================================
  // RULES / TURN FLOW
  // =====================================================================
  function checkGoal() {
    if (goalPause || gameOver) return;
    if (ball.y > GOAL.top && ball.y < GOAL.bottom) {
      if (ball.x + ball.r < PITCH.l) onGoal('ai');          // ball fully inside left net
      else if (ball.x - ball.r > PITCH.r) onGoal('player'); // ball fully inside right net
    }
  }

  function onGoal(scorer) {
    clearTimers();
    goalPause = true;
    shotFired = false;
    aiPending = false;
    drag = null;
    score[scorer]++;
    goalInfo = { scorer, start: performance.now() };

    if (score[scorer] >= WIN_SCORE) {
      gameOver = true;
      showModal(scorer);
      updateHUD(true);
      return;
    }
    updateHUD(true);
    later(() => {
      resetPositions();
      goalPause = false;
      goalInfo = null;
      turn = scorer === 'player' ? 'ai' : 'player';     // conceding side kicks off
      updateHUD(true);
    }, GOAL_PAUSE_MS);
  }

  function shoot(cap, vx, vy) {
    cap.vx = vx;
    cap.vy = vy;
    shotFired = true;
    isMoving = true;
  }

  function canShoot() {
    return turn === 'player' && !isMoving && !shotFired && !goalPause && !gameOver;
  }

  function step() {
    updatePhysics();
    checkGoal();

    // Physics has settled after a shot: hand the turn over.
    if (shotFired && !isMoving && !goalPause && !gameOver) {
      shotFired = false;
      turn = turn === 'player' ? 'ai' : 'player';
    }

    // AI trigger: its turn, everything at rest -> think for 1s, then shoot.
    if (turn === 'ai' && !isMoving && !shotFired && !goalPause && !gameOver && !aiPending) {
      aiPending = true;
      later(() => {
        aiPending = false;
        if (turn === 'ai' && !isMoving && !shotFired && !goalPause && !gameOver) aiMakeMove();
      }, AI_DELAY_MS);
    }
    updateHUD(false);
  }

  // =====================================================================
  // AI
  // =====================================================================
  function pathBlocked(x1, y1, x2, y2, r, exclude) {
    return bodies.some(o => !exclude.includes(o) && segDist(o.x, o.y, x1, y1, x2, y2) < r + o.r - 1);
  }
  function laneBlockers(x1, y1, x2, y2, r, exclude) {
    return bodies.filter(o => !exclude.includes(o) && segDist(o.x, o.y, x1, y1, x2, y2) < r + o.r).length;
  }

  function aiMakeMove() {
    const aiCaps = caps.filter(c => c.team === 'ai');
    // Aim points inside the player's (left) net: near post, center, far post.
    const targets = [GOAL.top + 28, H / 2, GOAL.bottom - 28].map(y => ({ x: PITCH.l - GOAL.depth / 2, y }));
    let best = null;

    for (const cap of aiCaps) {
      for (const tg of targets) {
        // Direction the ball must travel.
        const gx = tg.x - ball.x, gy = tg.y - ball.y;
        const gl = Math.hypot(gx, gy);
        if (gl < 1) continue;
        const ux = gx / gl, uy = gy / gl;

        // "Ghost cap" position: where the cap must be at impact to send the ball along (ux, uy).
        const ghx = ball.x - ux * (CAP_R + BALL_R);
        const ghy = ball.y - uy * (CAP_R + BALL_R);
        const cx = ghx - cap.x, cy = ghy - cap.y;
        const cl = Math.hypot(cx, cy);
        if (cl < 1) continue;
        const ax = cx / cl, ay = cy / cl;

        // Cut angle: how much of the cap's speed transfers along the desired line.
        const cos = ax * ux + ay * uy;
        if (cos < 0.3) continue;
        if (pathBlocked(cap.x, cap.y, ghx, ghy, CAP_R, [cap, ball])) continue;

        const lane = laneBlockers(ball.x, ball.y, tg.x, tg.y, BALL_R, [cap, ball]);
        const s = cos * 3 - cl / 350 - gl / 900 - lane * 1.2 + Math.random() * 0.15;
        if (!best || s > best.score) best = { cap, ax, ay, cl, gl, cos, score: s };
      }
    }

    if (best) {
      // Ball distance with friction f ≈ v/(1-f); ball gets ≈1.5·v·cos from a 3:1 mass hit.
      const ballSpeed = Math.min(30, best.gl * (1 - BALL_FRICTION) * 1.25 + 3);
      const impactSpeed = ballSpeed / (1.5 * Math.max(best.cos, 0.35));
      const speed = clamp(impactSpeed + (1 - CAP_FRICTION) * best.cl * 1.1, 7, MAX_SPEED);
      const ang = Math.atan2(best.ay, best.ax) + (Math.random() - 0.5) * 0.06; // small human error
      shoot(best.cap, Math.cos(ang) * speed, Math.sin(ang) * speed);
      return;
    }

    // Fallback: no clean goal shot. Strike the ball directly, preferring caps
    // that sit on the far side of it (so we don't knock it toward our own net).
    let pick = null, pickCost = Infinity;
    for (const cap of aiCaps) {
      const d = Math.hypot(ball.x - cap.x, ball.y - cap.y);
      let cost = d;
      if (cap.x < ball.x) cost += 400;
      if (pathBlocked(cap.x, cap.y, ball.x, ball.y, CAP_R, [cap, ball])) cost += 600;
      if (cost < pickCost) { pickCost = cost; pick = cap; }
    }
    const dx = ball.x - pick.x, dy = ball.y - pick.y, d = Math.hypot(dx, dy) || 1;
    const speed = clamp(d * 0.04 + 9, 9, MAX_SPEED);
    shoot(pick, dx / d * speed, dy / d * speed);
  }

  // =====================================================================
  // INPUT (mouse + touch)
  // =====================================================================
  function getPos(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: (clientX - r.left) * W / r.width, y: (clientY - r.top) * H / r.height };
  }

  function dragVector() {
    let dx = drag.cap.x - drag.x, dy = drag.cap.y - drag.y;
    let len = Math.hypot(dx, dy);
    if (len > MAX_DRAG) { dx *= MAX_DRAG / len; dy *= MAX_DRAG / len; len = MAX_DRAG; }
    return { x: dx, y: dy, len };
  }

  function capAt(p) {
    let best = null, bd = Infinity;
    for (const c of caps) {
      if (c.team !== 'player') continue;
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      if (d < c.r + 14 && d < bd) { bd = d; best = c; }   // generous hit area for fingers
    }
    return best;
  }

  function handleInput(type, p) {
    switch (type) {
      case 'start': {
        if (!canShoot()) return false;
        const cap = capAt(p);
        if (!cap) return false;
        drag = { cap, x: p.x, y: p.y };
        canvas.style.cursor = 'grabbing';
        return true;
      }
      case 'move':
        if (drag) { drag.x = p.x; drag.y = p.y; }
        else canvas.style.cursor = (canShoot() && capAt(p)) ? 'grab' : 'default';
        return !!drag;
      case 'end': {
        if (!drag) return false;
        const v = dragVector(), cap = drag.cap;
        drag = null;
        canvas.style.cursor = 'default';
        if (v.len < MIN_DRAG || !canShoot()) return true;
        // v = (CapPos - MousePos) * PowerFactor
        shoot(cap, v.x * POWER_FACTOR, v.y * POWER_FACTOR);
        return true;
      }
      case 'cancel':
        drag = null;
        canvas.style.cursor = 'default';
        return true;
    }
    return false;
  }

  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (handleInput('start', getPos(e.clientX, e.clientY))) e.preventDefault();
  });
  window.addEventListener('mousemove', e => handleInput('move', getPos(e.clientX, e.clientY)));
  window.addEventListener('mouseup', e => { if (e.button === 0) handleInput('end'); });

  let touchId = null;
  const findTouch = (list) => { for (const t of list) if (t.identifier === touchId) return t; return null; };
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (touchId !== null) return;
    const t = e.changedTouches[0];
    if (handleInput('start', getPos(t.clientX, t.clientY))) touchId = t.identifier;
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = findTouch(e.changedTouches);
    if (t) handleInput('move', getPos(t.clientX, t.clientY));
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    const t = findTouch(e.changedTouches);
    if (t) { handleInput('move', getPos(t.clientX, t.clientY)); handleInput('end'); touchId = null; }
  }, { passive: false });
  canvas.addEventListener('touchcancel', () => { handleInput('cancel'); touchId = null; });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') handleInput('cancel'); });

  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('modalBtn').addEventListener('click', resetGame);

  // =====================================================================
  // HUD
  // =====================================================================
  function updateHUD(force) {
    let text, cls;
    if (gameOver) { text = 'Full Time'; cls = ''; }
    else if (goalPause) { text = 'GOAL!'; cls = 'goal'; }
    else if (turn === 'player') { text = (shotFired || isMoving) ? 'Ball in play…' : 'Your Turn'; cls = 'player'; }
    else { text = 'AI Thinking...'; cls = 'ai'; }
    const key = `${score.player}|${score.ai}|${text}|${cls}`;
    if (!force && key === hudCache) return;
    hudCache = key;
    elP.textContent = score.player;
    elA.textContent = score.ai;
    elStatus.textContent = text;
    elStatus.className = cls;
  }

  function showModal(winner) {
    const won = winner === 'player';
    modalTitle.textContent = won ? 'VICTORY!' : 'GAME OVER!';
    modalTitle.style.color = won ? '#ff8a93' : '#8cc0ff';
    modalText.textContent = `Final score — Player ${score.player} : ${score.ai} AI`;
    modal.classList.add('show');
  }

  // =====================================================================
  // RENDERING
  // =====================================================================
  function makeLayer(drawFn) {
    const c = document.createElement('canvas');
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawFn(g);
    return c;
  }

  function setupCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    pitchLayer = makeLayer(drawPitch);
    netLayer = makeLayer(drawNets);
  }
  window.addEventListener('resize', () => {
    if (Math.min(window.devicePixelRatio || 1, 2) !== dpr) setupCanvas();
  });

  function drawPitch(g) {
    const { l, r, t, b } = PITCH;
    g.fillStyle = '#174d2c';
    g.fillRect(0, 0, W, H);

    // Mowed stripes
    const n = 10, sw = (r - l) / n;
    for (let i = 0; i < n; i++) {
      g.fillStyle = i % 2 ? '#2e8b47' : '#339a4f';
      g.fillRect(l + i * sw, t, sw + 0.5, b - t);
    }
    // Soft vignette
    const vg = g.createRadialGradient(W / 2, H / 2, 120, W / 2, H / 2, 480);
    vg.addColorStop(0, 'rgba(255,255,255,0.05)');
    vg.addColorStop(1, 'rgba(0,0,0,0.22)');
    g.fillStyle = vg;
    g.fillRect(l, t, r - l, b - t);

    // Goal floors
    g.fillStyle = '#1a5530';
    g.fillRect(l - GOAL.depth, GOAL.top, GOAL.depth, GOAL.bottom - GOAL.top);
    g.fillRect(r, GOAL.top, GOAL.depth, GOAL.bottom - GOAL.top);

    // Markings
    g.strokeStyle = 'rgba(255,255,255,0.85)';
    g.fillStyle = 'rgba(255,255,255,0.85)';
    g.lineWidth = 3;
    g.strokeRect(l, t, r - l, b - t);
    g.beginPath(); g.moveTo(W / 2, t); g.lineTo(W / 2, b); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 62, 0, TAU); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 4, 0, TAU); g.fill();

    for (const side of [0, 1]) {
      g.save();
      if (side) { g.translate(W, 0); g.scale(-1, 1); }
      g.strokeRect(l, 120, 110, 260);                  // penalty area
      g.strokeRect(l, 168, 40, 164);                   // goal area
      g.beginPath(); g.arc(l + 80, H / 2, 3.5, 0, TAU); g.fill(); // penalty spot
      const a = Math.acos(30 / 55);                    // penalty arc outside the box
      g.beginPath(); g.arc(l + 80, H / 2, 55, -a, a); g.stroke();
      g.beginPath(); g.arc(l, t, 14, 0, Math.PI / 2); g.stroke();       // corner arcs
      g.beginPath(); g.arc(l, b, 14, -Math.PI / 2, 0); g.stroke();
      g.restore();
    }
  }

  function drawNets(g) {
    const { l } = PITCH, gt = GOAL.top, gb = GOAL.bottom, d = GOAL.depth;
    for (const side of [0, 1]) {
      g.save();
      if (side) { g.translate(W, 0); g.scale(-1, 1); }
      // Net mesh (drawn over bodies so the ball looks "inside" the net)
      g.save();
      g.beginPath(); g.rect(l - d, gt, d, gb - gt); g.clip();
      g.fillStyle = 'rgba(0,0,0,0.12)';
      g.fillRect(l - d, gt, d, gb - gt);
      g.strokeStyle = 'rgba(255,255,255,0.35)';
      g.lineWidth = 1;
      for (let k = -160; k < 200; k += 9) {
        g.beginPath(); g.moveTo(l - d + k, gt); g.lineTo(l - d + k + (gb - gt), gb); g.stroke();
        g.beginPath(); g.moveTo(l - d + k, gb); g.lineTo(l - d + k + (gb - gt), gt); g.stroke();
      }
      g.restore();
      // Frame
      g.strokeStyle = '#f8fafc';
      g.lineWidth = 5;
      g.lineJoin = 'round';
      g.shadowColor = 'rgba(0,0,0,0.4)';
      g.shadowBlur = 4;
      g.beginPath();
      g.moveTo(l, gt); g.lineTo(l - d, gt); g.lineTo(l - d, gb); g.lineTo(l, gb);
      g.stroke();
      g.shadowBlur = 0;
      g.fillStyle = '#ffffff';
      for (const py of [gt, gb]) { g.beginPath(); g.arc(l, py, 5, 0, TAU); g.fill(); }
      g.restore();
    }
  }

  function drawShadow(b) {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(b.x + 3, b.y + 5, b.r, b.r * 0.9, 0, 0, TAU);
    ctx.fill();
  }

  function starPath(x, y, outer, inner, points) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const rad = i % 2 ? inner : outer;
      const a = -Math.PI / 2 + i * Math.PI / points;
      const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  function drawCap(c, now) {
    const col = c.team === 'player'
      ? { light: '#ff9aa2', base: '#e63946', dark: '#7f1620' }
      : { light: '#9cc8ff', base: '#2f80ed', dark: '#123b73' };

    // Turn highlight
    const active = !goalPause && !gameOver && !isMoving && !shotFired && turn === c.team;
    if (active) {
      const pulse = 0.5 + 0.5 * Math.sin(now / 220);
      ctx.strokeStyle = c.team === 'player'
        ? `rgba(255,230,120,${0.45 + 0.4 * pulse})`
        : `rgba(180,215,255,${0.25 + 0.3 * pulse})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 5 + pulse * 2, 0, TAU); ctx.stroke();
    }

    const g = ctx.createRadialGradient(c.x - c.r * 0.4, c.y - c.r * 0.45, c.r * 0.1, c.x, c.y, c.r);
    g.addColorStop(0, col.light);
    g.addColorStop(0.55, col.base);
    g.addColorStop(1, col.dark);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = col.dark;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 0.62, 0, TAU); ctx.fill();
    ctx.fillStyle = col.base;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 0.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff';
    starPath(c.x, c.y, c.r * 0.34, c.r * 0.15, 5);
    ctx.fill();

    // Gloss
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath(); ctx.ellipse(c.x - c.r * 0.3, c.y - c.r * 0.45, c.r * 0.45, c.r * 0.22, -0.5, 0, TAU); ctx.fill();

    if (drag && drag.cap === c) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 2, 0, TAU); ctx.stroke();
    }
  }

  function pentagon(x, y, rad, rot) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + i * TAU / 5;
      const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  function drawBall(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    const g = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.4, 1, 0, 0, b.r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.7, '#eef0f2');
    g.addColorStop(1, '#b9bec5');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();

    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, b.r - 0.5, 0, TAU); ctx.clip();
    ctx.rotate(b.rot);
    ctx.fillStyle = '#16181d';
    ctx.strokeStyle = 'rgba(20,20,20,0.55)';
    ctx.lineWidth = 0.8;
    pentagon(0, 0, b.r * 0.36, -Math.PI / 2);
    ctx.fill();
    for (let k = 0; k < 5; k++) {
      const a = -Math.PI / 2 + k * TAU / 5;
      const ix = Math.cos(a) * b.r * 0.36, iy = Math.sin(a) * b.r * 0.36;
      const ox = Math.cos(a) * b.r * 0.98, oy = Math.sin(a) * b.r * 0.98;
      ctx.beginPath(); ctx.moveTo(ix, iy); ctx.lineTo(ox * 0.78, oy * 0.78); ctx.stroke();
      pentagon(ox, oy, b.r * 0.3, a + Math.PI);
      ctx.fill();
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  function powerColor(p) {
    // green -> yellow -> red
    const hue = 120 - 120 * p;
    return `hsl(${hue}, 90%, 55%)`;
  }

  // First body the shooting cap would hit along its aim line.
  function raycast(c, ux, uy, maxD) {
    let best = maxD, hit = null;
    for (const o of bodies) {
      if (o === c) continue;
      const fx = c.x - o.x, fy = c.y - o.y, R = c.r + o.r;
      const bb = fx * ux + fy * uy;
      const cc = fx * fx + fy * fy - R * R;
      const disc = bb * bb - cc;
      if (disc < 0) continue;
      const t = -bb - Math.sqrt(disc);
      if (t > 0 && t < best) { best = t; hit = o; }
    }
    // Clamp to the pitch rectangle (walls)
    const tx = ux > 0 ? (PITCH.r - c.r - c.x) / ux : ux < 0 ? (PITCH.l + c.r - c.x) / ux : Infinity;
    const ty = uy > 0 ? (PITCH.b - c.r - c.y) / uy : uy < 0 ? (PITCH.t + c.r - c.y) / uy : Infinity;
    const tw = Math.max(0, Math.min(tx, ty));
    if (tw < best) { best = tw; hit = null; }
    return { t: best, hit };
  }

  function drawAim() {
    if (!drag) return;
    const c = drag.cap;
    const v = dragVector();
    if (v.len < 2) return;
    const p = v.len / MAX_DRAG;
    const ux = v.x / v.len, uy = v.y / v.len;
    const color = powerColor(p);
    const valid = v.len >= MIN_DRAG;

    // Slingshot band: from cap toward the (clamped) pull point
    const px = c.x - ux * v.len, py = c.y - uy * v.len;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(px, py); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(px, py, 5, 0, TAU); ctx.fill();

    if (valid) {
      // Predicted path (dotted) and contact ghost
      const speed = v.len * POWER_FACTOR;
      const travel = Math.min(460, speed / (1 - CAP_FRICTION));
      const ray = raycast(c, ux, uy, travel);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      for (let d = c.r + 8; d < ray.t; d += 12) {
        ctx.beginPath(); ctx.arc(c.x + ux * d, c.y + uy * d, 1.8, 0, TAU); ctx.fill();
      }
      const gx = c.x + ux * ray.t, gy = c.y + uy * ray.t;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.arc(gx, gy, c.r, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      if (ray.hit) {
        const nx = ray.hit.x - gx, ny = ray.hit.y - gy, nl = Math.hypot(nx, ny) || 1;
        ctx.strokeStyle = ray.hit === ball ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ray.hit.x, ray.hit.y);
        ctx.lineTo(ray.hit.x + nx / nl * 45, ray.hit.y + ny / nl * 45);
        ctx.stroke();
      }

      // Power arrow
      const sx = c.x + ux * (c.r + 4), sy = c.y + uy * (c.r + 4);
      const L = 22 + p * 110;
      const ex = sx + ux * L, ey = sy + uy * L;
      const lg = ctx.createLinearGradient(sx, sy, ex, ey);
      lg.addColorStop(0, 'rgba(255,255,255,0.15)');
      lg.addColorStop(1, color);
      ctx.strokeStyle = lg;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex - ux * 8, ey - uy * 8); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(ex + ux * 6, ey + uy * 6);
      ctx.lineTo(ex - ux * 10 - uy * 10, ey - uy * 10 + ux * 10);
      ctx.lineTo(ex - ux * 10 + uy * 10, ey - uy * 10 - ux * 10);
      ctx.closePath();
      ctx.fill();
    }

    // Power ring around the cap
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 9, 0, TAU); ctx.stroke();
    ctx.strokeStyle = valid ? color : 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 9, -Math.PI / 2, -Math.PI / 2 + p * TAU); ctx.stroke();

    // Power bar
    const bw = 56, bh = 8;
    const bx = clamp(c.x - bw / 2, 4, W - bw - 4);
    const by = c.y - c.r - 30 < 6 ? c.y + c.r + 20 : c.y - c.r - 30;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    ctx.fillStyle = valid ? color : 'rgba(255,255,255,0.4)';
    ctx.fillRect(bx, by, bw * p, bh);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(valid ? `${Math.round(p * 100)}%` : 'pull more', bx + bw / 2, by - 3);
  }

  function drawGoalOverlay(now) {
    if (!goalInfo) return;
    const t = (now - goalInfo.start) / 1000;
    const appear = Math.min(1, t * 5);
    const scale = appear < 1 ? 0.4 + 0.75 * appear : 1 + 0.06 * Math.sin(t * 8);
    const color = goalInfo.scorer === 'player' ? '#e63946' : '#2f80ed';

    ctx.fillStyle = `rgba(0,0,0,${0.35 * appear})`;
    ctx.fillRect(0, H / 2 - 70, W, 140);

    ctx.save();
    ctx.translate(W / 2, H / 2 - 8);
    ctx.scale(scale, scale);
    ctx.font = '900 86px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#ffffff';
    ctx.strokeText('GOAL!', 0, 0);
    ctx.fillStyle = color;
    ctx.fillText('GOAL!', 0, 0);
    ctx.restore();

    ctx.font = '700 20px system-ui, sans-serif';
    ctx.fillStyle = `rgba(255,255,255,${appear})`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(goalInfo.scorer === 'player' ? 'You score!' : 'AI scores!', W / 2, H / 2 + 46);
  }

  function draw(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(pitchLayer, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    for (const b of bodies) drawShadow(b);
    for (const c of caps) drawCap(c, now);
    drawBall(ball);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(netLayer, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawAim();
    drawGoalOverlay(now);
  }

  // =====================================================================
  // MAIN LOOP (fixed 60 Hz simulation, render every animation frame)
  // =====================================================================
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250);   // clamp after tab switches
    last = now;
    while (acc >= STEP_MS) { step(); acc -= STEP_MS; }
    draw(now);
    requestAnimationFrame(loop);
  }

  setupCanvas();
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
